name: 'Setup'
description: 'Sets up the repository (Bun + Node) and builds dist-emitting workspace packages'
inputs:
  install:
    description: 'Whether to install dependencies'
    required: false
    default: 'true'
  build-contracts:
    description: 'Whether to build @repo/contracts (skip for jobs that do not need its ABIs)'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    # Bun owns installs, workspace resolution, and script running; the version comes from
    # package.json#packageManager, so it is not repeated here. Node runs the code.
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json

    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: bun install --frozen-lockfile

    - name: Build @repo/contracts
      if: ${{ inputs.build-contracts == 'true' }}
      shell: bash
      run: bun run --cwd packages/contracts build
